name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        # requirements-dev.txt includes requirements.txt
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # Offline: no OpenAI key, no network, no prebuilt FAISS index needed
        run: pytest -q
